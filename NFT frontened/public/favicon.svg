<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background tile gradient with oceanic depth -->
    <linearGradient id="bgTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121c"/>
      <stop offset="50%" stop-color="#07202f"/>
      <stop offset="100%" stop-color="#02090e"/>
    </linearGradient>

    <!-- Gem main body using user palette: #00abc5 to #2ec7c0 to #87dfe9 -->
    <linearGradient id="gemBody" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#b2e5ed"/>
      <stop offset="30%" stop-color="#87dfe9"/>
      <stop offset="70%" stop-color="#2ec7c0"/>
      <stop offset="100%" stop-color="#00abc5"/>
    </linearGradient>

    <!-- Aqua glow filter -->
    <filter id="aquaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Tile Container with Cyan Border -->
  <rect width="64" height="64" rx="18" fill="url(#bgTile)" stroke="#2ec7c0" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Outer Glow Aura -->
  <circle cx="32" cy="32" r="20" fill="#00abc5" opacity="0.2" filter="url(#aquaGlow)"/>

  <!-- NFT Gem Hexagon Facets -->
  <!-- Top Facet Table -->
  <polygon points="32,12 47,21 32,30 17,21" fill="#b2e5ed" fill-opacity="0.95"/>

  <!-- Left Upper Facet -->
  <polygon points="17,21 32,30 32,52 14,35" fill="#2ec7c0" fill-opacity="0.85"/>

  <!-- Right Upper Facet -->
  <polygon points="47,21 32,30 32,52 50,35" fill="#00abc5" fill-opacity="0.9"/>

  <!-- Central Sharp Edge Highlight -->
  <line x1="32" y1="30" x2="32" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Outer Gem Outlines in Bright Ice Cyan -->
  <polygon points="32,12 47,21 50,35 32,52 14,35 17,21" fill="none" stroke="#99dde7" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Sparkle Star 1 (Top Right) -->
  <path d="M48,10 L50,14 L54,16 L50,18 L48,22 L46,18 L42,16 L46,14 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Sparkle Star 2 (Bottom Left) -->
  <circle cx="16" cy="46" r="1.5" fill="#87dfe9" opacity="0.8"/>
</svg>
